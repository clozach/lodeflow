<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try lodeflow: editable flow diagrams that arrange themselves, saved only in your browser.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>lodeflow</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#playground">Skip to diagram</a>
  <header class="masthead">
    <a class="brand" href="./" aria-label="lodeflow home"><img class="brand-logo" src="./logo.svg" alt="lodeflow" width="61" height="50"></a>
    <a class="source-link" href="https://github.com/clozach/lodeflow">Code on GitHub <span aria-hidden="true">↗</span></a>
  </header>
  <main>
      <section id="playground" class="playground" aria-label="Editable diagram" tabindex="-1">
        <div class="toolbar">
          <div class="appearance"><label for="appearance">Style</label><select id="appearance"><option value="light">Standard</option><option value="blueprint">Blueprint</option></select></div>
          <span id="item-count" class="item-count" aria-live="polite">15 / 100 items</span>
          <span id="save-status" role="status" title="Diagram data stays in this browser’s localStorage.">Loading…</span>
          <div class="reset-controls"><button id="reset" title="Restore the examples; Undo brings your diagram back">Restore tutorial</button><button id="hard-reset" title="All data storage is local-only. Clicking this button resets the tutorial and deletes all your edits. ⚠️ Cannot be undone.">Hard Reset</button></div>
        </div>
        <div class="canvas-frame"><lode-flow id="flow" theme="light" max-items="100" storage-key="public-tutorial-v1" node-width="190" fit-min="0.62" wheel="auto" aria-label="Lodeflow tutorial diagram"></lode-flow></div>
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="tab-notice" class="notice tab-notice" role="status" hidden><span>Another tab saved changes. Your current work stays here until you choose to load them.</span><button id="load-saved">Load saved changes</button></div>
      </section>
    <noscript><p class="notice">Enable JavaScript to use the diagram editor. <a href="https://github.com/clozach/lodeflow">Read the source and documentation on GitHub.</a></p></noscript>
  </main>
</body>
</html>
