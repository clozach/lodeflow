<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lodeflow — standalone example</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    header { padding: 12px 16px 0; }
    h1 { font-size: 16px; margin: 0; }
    p { margin: 4px 0 10px; font-size: 13px; opacity: .75; }
    /* A resizable frame: drag its corner to watch the diagram re-orient itself. */
    .frame { resize: both; overflow: hidden; width: min(1100px, calc(100vw - 32px)); height: 70vh; margin: 0 16px 16px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; min-width: 240px; min-height: 200px; }
    lode-flow { height: 100%; }
  </style>
  <script type="module" src="../web/dist/lode-flow.js"></script>
  <script>
    // Dev loop (pnpm dev): ?live reloads this page whenever esbuild rebuilds.
    if (location.search.includes('live')) new EventSource('/esbuild').addEventListener('change', () => location.reload());
  </script>
</head>
<body>
  <header>
    <h1>lodeflow</h1>
    <p>Drag the frame's bottom-right corner: in <b>Auto</b> orientation the flow turns to fit. Press <kbd>?</kbd> inside the diagram for every gesture.</p>
  </header>
  <div class="frame">
    <lode-flow id="demo" src="./release-slip.json"></lode-flow>
  </div>
</body>
</html>
