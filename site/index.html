<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn lodeflow in linked instruction and practice diagrams, saved only in your browser.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>lodeflow</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#practice">Skip to practice diagram</a>
  <header class="masthead"><a class="brand" href="./" aria-label="lodeflow home"><img class="brand-logo" src="./logo.svg" alt="lodeflow" width="61" height="50"></a></header>
  <main>
    <section class="guide-frame" aria-label="Tutorial steps"><lode-flow id="guide" presentation="graph" node-activation="event" group-activation="event" orientation="lr" compactness="compact" node-width="220" fit-min="1" aria-label="Instruction diagram"></lode-flow></section>
    <section id="practice" class="practice-frame" aria-label="Practice diagram" tabindex="-1">
      <lode-flow id="flow" theme="light" empty-hint max-items="100" storage-key="public-tutorial-v2" node-width="190" wheel="auto" aria-label="Editable practice diagram">
        <div slot="help" class="demo-settings">
          <div class="appearance"><label for="appearance">Style</label><select id="appearance"><option value="light">Standard</option><option value="blueprint">Blueprint</option></select><span id="item-count" class="item-count">0 / 100 items</span></div>
          <p id="save-status" role="status">Loading…</p>
          <div class="reset-controls"><button id="reset" title="Start again with blank diagrams; Undo brings your practice diagram back">Restore tutorial</button><button id="hard-reset" title="All data storage is local-only. Clicking this button resets the tutorial and deletes all your edits. ⚠️ Cannot be undone.">Hard Reset</button></div>
          <a class="source-link" href="https://github.com/clozach/lodeflow">Code on GitHub ↗</a>
        </div>
      </lode-flow>
      <p id="notice" class="notice" role="status" hidden></p>
      <div id="tab-notice" class="notice tab-notice" role="status" hidden><span>Another tab saved changes. Your work stays here until you load them.</span><button id="load-saved">Load saved changes</button></div>
    </section>
    <noscript><p class="notice">Enable JavaScript to use the diagrams. <a href="https://github.com/clozach/lodeflow">Read the source on GitHub.</a></p></noscript>
  </main>
</body>
</html>
